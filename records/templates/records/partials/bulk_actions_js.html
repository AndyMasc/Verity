{# bulk_action_js.html #}
<style>
    [data-optimistic-removed="true"] {
        display: none;
    }
</style>
<script>
    function recordBulkActions() {
        return {
            selectedIds: [],
            archiving: false,
            unarchiving: false,
            hardDeleting: false,
            exporting: false,
            creatingPackage: false,
            showPackageModal: false,
            packageTitle: 'Expense Reimbursement',
            recipientEmail: '',
            includeDocuments: true,
            recipientStatus: '',
            recipientRegistered: false,
            packageError: '',
            emailCheckTimeout: null,
            showShareModal: false,
            shareEmails: '',
            sharing: false,
            shareError: '',

            _collectVisibleIds() {
                // All currently rendered record rows, including pages appended
                // by infinite scroll. data-record-id appears on both the poster
                // wrapper and the card root, so dedupe.
                const container = document.getElementById('query-results-container')
                || document.getElementById('dashboard-content');
                if (!container) return [];
                return [...new Set(
                    [...container.querySelectorAll('[data-record-id]')].map(el => el.dataset.recordId)
                )];
            },

            // Eligibility is read from the rendered cards so the bar only
            // offers an action that at least one selected record supports.
            _selectedCards() {
                return this.selectedIds
                    .map(id => document.querySelector(`[data-record-id="${id}"]`))
                    .filter(Boolean);
            },

            get selectedActiveCount() {
                return this._selectedCards().filter(c => c.dataset.recordActive === 'true').length;
            },

            get selectedArchivedCount() {
                return this._selectedCards().filter(c => c.dataset.recordActive === 'false').length;
            },

            get selectedPermanentCount() {
                return this._selectedCards().filter(c => c.dataset.recordPermanent === 'true').length;
            },

            get canArchive() {
                return this.selectedActiveCount > 0;
            },

            get canRestore() {
                return this.selectedArchivedCount > 0;
            },

            get canHardDelete() {
                return this.selectedPermanentCount > 0;
            },

            get allVisibleSelected() {
                const visible = this._collectVisibleIds();
                return visible.length > 0 && visible.every(id => this.selectedIds.includes(id));
            },

            toggleSelect(id) {
                if (this.selectedIds.includes(id)) {
                    this.selectedIds = this.selectedIds.filter(i => i !== id);
                } else {
                    this.selectedIds.push(id);
                }
            },

            toggleSelectAll() {
                const visible = this._collectVisibleIds();
                if (this.allVisibleSelected) {
                    this.selectedIds = this.selectedIds.filter(id => !visible.includes(id));
                } else {
                    this.selectedIds = [...new Set([...this.selectedIds, ...visible])];
                }
            },

            clearSelection() {
                this.selectedIds = [];
            },

            _getCsrfToken() {
                return document.querySelector('meta[name="csrf-token"]')?.content || '';
            },

            _toast(message, level) {
                window.dispatchEvent(new CustomEvent('django-messages', {
                    detail: { message, level }
                }));
            },

            openPackageModal() {
                this.packageTitle = 'Expense Reimbursement';
                this.recipientEmail = '';
                this.includeDocuments = true;
                this.recipientStatus = '';
                this.recipientRegistered = false;
                this.showPackageModal = true;
            },

            openShareModal() {
                this.shareEmails = '';
                this.shareError = '';
                this.showShareModal = true;
            },

            async bulkShare() {
                this.shareError = '';
                const emails = this.shareEmails
                    .split(',')
                    .map(e => e.trim())
                    .filter(e => e.length > 0);
                if (emails.length === 0) {
                    this.shareError = 'Enter at least one recipient email.';
                    return;
                }
                this.sharing = true;
                try {
                    const response = await fetch("{% url 'records:bulk_share' %}", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': this._getCsrfToken(),
                            'X-Requested-With': 'XMLHttpRequest',
                        },
                        body: JSON.stringify({
                            record_ids: this.selectedIds.map(Number),
                            emails: emails.join(', '),
                        }),
                    });
                    const data = await response.json().catch(() => null);
                    if (response.ok && data && typeof data.shared === 'number') {
                        this.showShareModal = false;
                        this.selectedIds = [];
                        const recipientCount = typeof data.recipients === 'number' ? data.recipients : emails.length;
                        if (data.shared > 0) {
                            this._toast(
                                'Shared ' + data.shared + ' record' + (data.shared === 1 ? '' : 's') +
                                ' with ' + recipientCount + ' recipient' + (recipientCount === 1 ? '' : 's') + '.',
                                25
                            );
                            if (data.unknown?.length) {
                                this._toast('No account found for: ' + data.unknown.join(', '), 40);
                            }
                        } else if (data.self_skipped > 0) {
                            this._toast('Cannot share records with yourself.', 40);
                        } else if (data.unknown?.length) {
                            this._toast('No account found for: ' + data.unknown.join(', '), 40);
                        } else {
                            this._toast('Selected records are already shared with the recipient.', 40);
                        }
                    } else {
                        this.shareError = (data && data.error) || 'Failed to share records. Please try again.';
                    }
                } catch {
                    this.shareError = 'A network error occurred. Please try again.';
                } finally {
                    this.sharing = false;
                }
            },

            onEmailInput() {
                clearTimeout(this.emailCheckTimeout);
                this.recipientStatus = '';
                this.recipientRegistered = false;
                if (!this.recipientEmail.trim() || !this.recipientEmail.includes('@')) return;
                this.emailCheckTimeout = setTimeout(() => this.checkEmail(), 500);
            },

            async checkEmail() {
                this.recipientStatus = 'checking';
                try {
                    const resp = await fetch("{% url 'reimbursements:validate-email' %}", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': this._getCsrfToken(),
                        },
                        body: JSON.stringify({ email: this.recipientEmail.trim() }),
                    });
                    const data = await resp.json();
                    if (data.valid) {
                        this.recipientStatus = 'valid';
                        this.recipientRegistered = !!data.registered;
                    } else {
                        this.recipientStatus = 'invalid';
                        this.packageError = data.error;
                    }
                } catch {
                    this.recipientStatus = 'invalid';
                    this.packageError = 'Could not verify email.';
                }
            },

            async createReimbursementPackage() {
                this.packageError = '';
                if (!this.recipientEmail.trim()) {
                    this.packageError = 'Recipient email is required.';
                    return;
                }
                if (this.recipientStatus !== 'valid') {
                    await this.checkEmail();
                    if (this.recipientStatus !== 'valid') return;
                }

                this.creatingPackage = true;
                try {
                    const response = await fetch("{% url 'reimbursements:create-package' %}", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': this._getCsrfToken(),
                            'X-Requested-With': 'XMLHttpRequest',
                        },
                        body: JSON.stringify({
                            record_ids: this.selectedIds.map(Number),
                            title: this.packageTitle.trim() || 'Expense Reimbursement',
                            recipient_email: this.recipientEmail.trim(),
                            include_documents: this.includeDocuments,
                        }),
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.showPackageModal = false;
                        if (data.redirect_url) {
                            window.location.href = data.redirect_url;
                        }
                    } else {
                        let errorMsg = 'Failed to create reimbursement package.';
                        try {
                            const err = await response.json();
                            errorMsg = err.error || errorMsg;
                        } catch {}
                        this.packageError = errorMsg;
                    }
                } catch {
                    this.packageError = 'A network error occurred. Please try again.';
                } finally {
                    this.creatingPackage = false;
                }
            },

            _optimisticRemove(ids) {
                ids.forEach(id => {
                    const card = document.querySelector(`[data-record-id="${id}"]`);
                    if (card) card.dataset.optimisticRemoved = 'true';
                });
            },

            _rollbackOptimisticRemove(ids) {
                ids.forEach(id => {
                    const card = document.querySelector(`[data-record-id="${id}"]`);
                    if (card) delete card.dataset.optimisticRemoved;
                });
            },

            _crossTabSyncTimer: null,
            _triggerCrossTabSync() {
                if (this._crossTabSyncTimer) clearTimeout(this._crossTabSyncTimer);
                this._crossTabSyncTimer = setTimeout(() => {
                    document.body.dispatchEvent(new Event('recordChanged'));
                    this._crossTabSyncTimer = null;
                }, 2000);
            },

            async hardDeleteOne(id) {
                if (!confirm('Permanently delete this record? This cannot be undone.')) return;
                try {
                    const response = await fetch("{% url 'records:bulk_hard_delete' %}", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': this._getCsrfToken(),
                            'X-Requested-With': 'XMLHttpRequest',
                        },
                        body: JSON.stringify({ record_ids: [Number(id)] }),
                    });
                    const data = await response.json().catch(() => ({}));
                    if (response.ok && data.count === 1) {
                        this._optimisticRemove([id]);
                        this._toast('Record permanently deleted.', 25);
                    } else {
                        this._toast(data.error || 'Only records past the 7-year retention window can be permanently deleted.', 40);
                    }
                } catch {
                    this._toast('A network error occurred.', 40);
                }
                this._triggerCrossTabSync();
            },

            async bulkHardDelete() {
                const eligible = this.selectedPermanentCount;
                if (!eligible) return;
                const total = this.selectedIds.length;
                const confirmText = eligible === total
                    ? 'Permanently delete ' + total + ' record(s)? This cannot be undone.'
                    : 'Permanently delete ' + eligible + ' of ' + total + ' selected record(s)? '
                      + (total - eligible) + ' are not past the 7-year retention window and will be kept. This cannot be undone.';
                if (!confirm(confirmText)) return;

                const ids = [...this.selectedIds];
                this.selectedIds = [];
                this.hardDeleting = true;
                try {
                    const response = await fetch("{% url 'records:bulk_hard_delete' %}", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': this._getCsrfToken(),
                            'X-Requested-With': 'XMLHttpRequest',
                        },
                        body: JSON.stringify({ record_ids: ids.map(Number) }),
                    });
                    const data = await response.json().catch(() => ({}));
                    if (response.ok && typeof data.count === 'number') {
                        const skipped = typeof data.skipped === 'number' ? data.skipped : ids.length - data.count;
                        this._toast(
                            skipped
                                ? 'Permanently deleted ' + data.count + ' of ' + ids.length
                                  + ' records — ' + skipped + ' skipped, not past the 7-year retention window.'
                                : 'Permanently deleted ' + data.count + ' record' + (data.count === 1 ? '' : 's') + '.',
                            skipped ? 30 : 25
                        );
                    } else {
                        this._toast(data.error || 'Failed to delete records.', 40);
                    }
                } catch {
                    this._toast('A network error occurred.', 40);
                } finally {
                    this.hardDeleting = false;
                }
                this._triggerCrossTabSync();
            },

            async bulkArchive() {
                if (!confirm('Archive ' + this.selectedIds.length + ' record(s)?')) return;
                const ids = [...this.selectedIds];
                this.selectedIds = [];
                this.archiving = true;
                try {
                    const response = await fetch("{% url 'records:bulk_archive' %}", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': this._getCsrfToken(),
                            'X-Requested-With': 'XMLHttpRequest',
                        },
                        body: JSON.stringify({ record_ids: ids.map(Number) }),
                    });
                    const data = await response.json().catch(() => ({}));
                    if (response.ok && typeof data.count === 'number') {
                        if (data.count === ids.length) {
                            this._optimisticRemove(ids);
                            this._toast('Archived ' + data.count + ' record' + (data.count === 1 ? '' : 's') + '.', 25);
                        } else {
                            this._toast(
                                'Archived ' + data.count + ' of ' + ids.length + ' records — the rest were skipped.',
                                30
                            );
                        }
                    } else {
                        this._toast(data.error || 'Failed to archive records.', 40);
                    }
                } catch {
                    this._toast('A network error occurred.', 40);
                } finally {
                    this.archiving = false;
                }
                this._triggerCrossTabSync();
            },

            async bulkUnarchive() {
                if (!confirm('Restore ' + this.selectedIds.length + ' record(s)?')) return;
                const ids = [...this.selectedIds];
                this._optimisticRemove(ids);
                this.selectedIds = [];
                this.unarchiving = true;
                try {
                    const response = await fetch("{% url 'records:bulk_unarchive' %}", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': this._getCsrfToken(),
                            'X-Requested-With': 'XMLHttpRequest',
                        },
                        body: JSON.stringify({ record_ids: ids.map(Number) }),
                    });
                    const data = await response.json().catch(() => ({}));
                    if (response.ok && typeof data.count === 'number') {
                        if (data.count === ids.length) {
                            this._toast('Restored ' + data.count + ' record' + (data.count === 1 ? '' : 's') + '.', 25);
                        } else {
                            this._rollbackOptimisticRemove(ids);
                            this._toast(
                                'Restored ' + data.count + ' of ' + ids.length + ' records — the rest were skipped.',
                                30
                            );
                        }
                    } else {
                        this._toast(data.error || 'Failed to restore records.', 40);
                        this._rollbackOptimisticRemove(ids);
                    }
                } catch {
                    this._rollbackOptimisticRemove(ids);
                    this._toast('A network error occurred.', 40);
                } finally {
                    this.unarchiving = false;
                }
                this._triggerCrossTabSync();
            },

            async exportSelected() {
                this.exporting = true;
                try {
                    const response = await fetch("{% url 'accounting:export_selected_to_excel' %}", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': this._getCsrfToken(),
                            'X-Requested-With': 'XMLHttpRequest',
                        },
                        body: JSON.stringify({ record_ids: this.selectedIds.map(Number) }),
                    });
                    if (response.ok) {
                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'Record_export.xlsx';
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        window.URL.revokeObjectURL(url);
                    } else {
                        const err = await response.json().catch(() => ({}));
                        this._toast(err.error || 'Export failed.', 40);
                    }
                } catch {
                    this._toast('A network error occurred during export.', 40);
                } finally {
                    this.exporting = false;
                }
            },
        };
    }
</script>
