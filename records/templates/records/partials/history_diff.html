{% load form_tags %}
{% for field in fields %}
    {% with old_val=prev_record|get_attr:field new_val=entry|get_attr:field %}
        {% if old_val != new_val %}
            <div class="space-y-1">
                <span class="text-[11px] font-bold tracking-wide text-zinc-700 uppercase dark:text-zinc-300">{{ field|title|cut:"_" }}</span>
                <div class="flex items-center gap-2 text-xs">
                    <span class="font-medium text-zinc-600 line-through decoration-zinc-400/70 dark:text-zinc-400 dark:decoration-zinc-500/70">{{ old_val|default:"—" }}</span>
                    <svg class="h-3 w-3 shrink-0 text-zinc-600 dark:text-zinc-400"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="2.5"
                         stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                    </svg>
                    <span class="font-semibold text-zinc-950 dark:text-zinc-50">{{ new_val|default:"—" }}</span>
                </div>
            </div>
        {% endif %}
    {% endwith %}
{% endfor %}
