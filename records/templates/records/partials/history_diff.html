{% load form_tags %}
{% for field in fields %}
    {% with old_val=prev_record|get_attr:field new_val=entry|get_attr:field %}
        {% if old_val != new_val %}
            <div class="rounded-lg border border-zinc-200 bg-zinc-50/80 p-3 dark:border-zinc-800 dark:bg-zinc-950/40">
                <span class="text-[11px] font-bold tracking-wider text-zinc-900 uppercase dark:text-zinc-100">{{ field|title|cut:"_" }}</span>
                <div class="flex flex-col gap-1 text-xs sm:flex-row sm:items-center sm:gap-2">
                    <span class="font-medium text-red-600 line-through decoration-red-400 dark:text-red-400 dark:decoration-red-500/70">{{ old_val|default:"—" }}</span>
                    <svg class="h-3.5 w-3.5 shrink-0 rotate-90 text-zinc-500 sm:rotate-0 dark:text-zinc-400"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="2.5"
                         stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                    </svg>
                    <span class="font-bold text-emerald-700 dark:text-emerald-400">{{ new_val|default:"—" }}</span>
                </div>
            </div>
        {% endif %}
    {% endwith %}
{% endfor %}
