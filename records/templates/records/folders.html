{% extends "base.html" %}
{% load widget_tweaks %}
{% block content %}
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-6 selection:bg-zinc-900 selection:text-white dark:selection:bg-white dark:selection:text-black">
        <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mt-5">
            <div>
                <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-zinc-950 dark:text-zinc-50 capitalize">Folders</h1>
                <p class="text-xs sm:text-sm text-zinc-500 dark:text-zinc-400 mt-1">Group related records for quick access and streamlined management.</p>
            </div>
            <button type="button"
                    hx-get="{% url 'records:create_folder' %}"
                    hx-target="#modal-container"
                    hx-swap="innerHTML"
                    class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-4 py-2 text-xs font-medium text-white bg-black dark:text-black dark:bg-white hover:bg-zinc-800 dark:hover:bg-zinc-200 rounded-xl shadow-sm transition-all duration-200 cursor-pointer active:scale-[0.98]">
                <svg class="size-4"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke-width="2"
                     stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                New Folder
            </button>
        </header>
        <section class="space-y-3" aria-label="Directory Search Matrix">
            <div class="relative w-full group">
                <div class="absolute inset-y-0 left-3.5 flex items-center pointer-events-none text-zinc-400 dark:text-zinc-500 transition-colors">
                    <svg class="w-4 h-4"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="2"
                         stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                </div>
                <input class="w-full bg-white dark:bg-zinc-900/40 border border-zinc-200 dark:border-white/[0.06] py-3 pl-10 pr-4 text-xs font-normal rounded-xl text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-500 shadow-2xs focus:outline-none focus:ring-1 focus:ring-zinc-900 dark:focus:ring-white/40 focus:border-zinc-900 dark:focus:border-white transition-all duration-200"
                       placeholder="Search folders by name..."
                       id="folder-search"
                       type="search"
                       name="search"
                       hx-get="{% url 'records:view_folders' %}"
                       hx-trigger="input changed delay:300ms, keyup[key=='Enter']"
                       hx-target="#directory-results-container"
                       hx-indicator="#folder-list-indicator">
            </div>
        </section>
        <div id="folder-list-indicator"
             class="htmx-indicator relative z-10 hidden">
            <div class="absolute inset-0 bg-white/60 dark:bg-zinc-950/60 backdrop-blur-[2px] flex items-center justify-center rounded-xl"
                 style="top: -2rem;
                        bottom: -2rem">
                <div class="text-xs font-medium text-zinc-900 dark:text-zinc-100 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800/80 px-4 py-2.5 rounded-xl shadow-md flex items-center gap-2.5">
                    <svg class="w-3.5 h-3.5 animate-spin text-zinc-500"
                         fill="none"
                         viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    Syncing Directory...
                </div>
            </div>
        </div>
        <main id="directory-results-container"
              class="relative min-h-0 w-full min-w-0 mt-6 space-y-6">
            {% include 'records/partials/folders/folder_list_partial.html' %}
        </main>
    </div>
    <div id="modal-container"></div>
    <script>
        document.body.addEventListener('closeModal', function() {
            document.getElementById('modal-container').innerHTML = '';
        });
    </script>
{% endblock content %}
