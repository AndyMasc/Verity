{% extends "base.html" %}
{% load widget_tweaks %}
{% block content %}
    <div class="mx-auto max-w-9xl space-y-6 py-12 selection:bg-zinc-900 selection:text-white dark:selection:bg-white dark:selection:text-black">
        <header class="mt-5 flex flex-col items-start justify-between gap-4 sm:flex-row sm:items-center">
            <div>
                <h1 class="text-2xl font-semibold tracking-tight text-zinc-950 capitalize sm:text-3xl dark:text-zinc-50">Folders</h1>
                <p class="mt-1 text-xs text-zinc-500 sm:text-sm dark:text-zinc-400">Group related records for quick access and streamlined management.</p>
            </div>
            <button type="button"
                    hx-get="{% url 'records:create_folder' %}"
                    hx-target="#modal-container"
                    hx-swap="innerHTML"
                    class="inline-flex w-full cursor-pointer items-center justify-center gap-2 rounded-xl bg-black px-4 py-2 text-xs font-medium text-white shadow-sm transition-all duration-200 hover:bg-zinc-800 active:scale-[0.98] sm:w-auto dark:bg-white dark:text-black dark:hover:bg-zinc-200">
                <svg class="size-4"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke-width="2"
                     stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                New Folder
            </button>
        </header>
        <section class="space-y-3" aria-label="Directory Search Matrix">
            <div class="group relative w-full">
                <div class="pointer-events-none absolute inset-y-0 left-3.5 flex items-center text-zinc-400 transition-colors dark:text-zinc-500">
                    <svg class="h-4 w-4"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="2"
                         stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                </div>
                <input class="shadow-2xs w-full rounded-xl border border-zinc-200 bg-white py-3 pr-4 pl-10 text-xs font-normal text-zinc-900 placeholder-zinc-400 transition-all duration-200 focus:border-zinc-900 focus:ring-1 focus:ring-zinc-900 focus:outline-none dark:border-white/[0.06] dark:bg-zinc-900/45 dark:text-zinc-100 dark:placeholder-zinc-500 dark:focus:border-white dark:focus:ring-white/40"
                       placeholder="Search folders by name..."
                       id="folder-search"
                       type="search"
                       name="search"
                       hx-get="{% url 'records:view_folders' %}"
                       hx-trigger="input changed delay:300ms, keyup[key=='Enter']"
                       hx-target="#directory-results-container"
                       hx-indicator="#folder-list-indicator">
            </div>
        </section>
        <div id="folder-list-indicator"
             class="htmx-indicator relative z-10 hidden">
            <div class="absolute inset-0 flex items-center justify-center rounded-xl bg-white/60 backdrop-blur-[2px] dark:bg-zinc-950/60"
                 style="top: -2rem;
                        bottom: -2rem">
                <div class="flex items-center gap-2.5 rounded-xl border border-zinc-200 bg-white px-4 py-2.5 text-xs font-medium text-zinc-900 shadow-md dark:border-zinc-800/80 dark:bg-zinc-900 dark:text-zinc-100">
                    <svg class="h-3.5 w-3.5 animate-spin text-zinc-500"
                         fill="none"
                         viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    Syncing...
                </div>
            </div>
        </div>
        <main id="directory-results-container"
              class="relative mt-6 min-h-0 w-full min-w-0 space-y-6">
            {% include 'records/partials/folders/folder_list_partial.html' %}
        </main>
    </div>
    <div id="modal-container"></div>
    <script>
        document.body.addEventListener('closeModal', function() {
            document.getElementById('modal-container').innerHTML = '';
        });
    </script>
{% endblock content %}
