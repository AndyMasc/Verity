# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm ecosystem configuration
  - package-ecosystem: "npm" 
    directory: "/" 
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5

  # pip ecosystem configuration
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    ignore:
      # slippers requires typeguard<3 (still true as of slippers 0.7.1), so
      # typeguard 3+ makes `pip install -r requirements.txt` unresolvable and
      # the Docker build fails. typeguard has no other consumer.
      - dependency-name: "typeguard"
        versions: [">=3"]
