name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy .
      - name: Bandit (security)
        run: bandit -q -r core documents records plaid_integration accounting reimbursements billing Verity -x "*/migrations/*,*/tests/*,*/tests.py,*/test_*,venv/*"
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit

  test:
    name: Tests (PostgreSQL + Valkey + LavinMQ)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    # These run temporarily on the GitHub server just for tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: Verity.settings.ci
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/verity
      DB_SSLMODE: disable
      REDIS_URL: redis://localhost:6379/0
      RABBIT_MQ_URL: amqp://guest:guest@localhost:5672/
      SECRET_KEY: ci-secret-key-not-for-production
      ALLOWED_HOSTS: localhost,127.0.0.1
      R2_ACCESS_KEY_ID: ci-r2-key
      R2_SECRET_ACCESS_KEY: ci-r2-secret
      R2_STORAGE_BUCKET_NAME: ci-bucket
      R2_S3_ENDPOINT_URL: https://example.com
      R2_VERITY_STORAGE_ACCOUNT_ID: ci-account
      GEMINI_API_KEY: ci-gemini-key
      RESEND_API_KEY: ci-resend-key
      GOOGLE_OAUTH_CLIENT_ID: ci-google-id
      GOOGLE_OAUTH_CLIENT_SECRET: ci-google-secret
      GITHUB_OAUTH_CLIENT_ID: ci-github-id
      GITHUB_OAUTH_CLIENT_SECRET: ci-github-secret
      WEB_PUSH_PUBLIC_KEY: ci-vapid-public
      WEB_PUSH_PRIVATE_KEY: ci-vapid-private
      WEB_PUSH_EMAIL: ci@example.com
      PLAID_CLIENT_ID: ci-plaid-id
      PLAID_SECRET: ci-plaid-secret
      PLAID_ENV: sandbox
      PLAID_WEBHOOK_URL: http://localhost:8000/plaid/webhook/
      FERNET_KEY: ci-fernet-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_PUBLISHABLE_KEY: pk_test_ci
      DJSTRIPE_FOREIGN_KEY_TO_FIELD: djstripe_id
      SENTRY_DSN: https://example.com

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Django system checks
        run: python manage.py check
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=0

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --progress=plain -t verity:ci .
