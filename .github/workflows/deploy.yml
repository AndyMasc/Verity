name: Deploy

# Manual only. This template is not wired to a deploy mechanism yet, and
# ./deploy.sh does not exist, so triggering it on push would just go red.
# Replace the Deploy step below, then switch this back to push on main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to deploy
        required: true
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve PostHog release
        id: posthog-release
        uses: PostHog/resolve-release@v1
        with:
          api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          project-id: ${{ vars.POSTHOG_PROJECT_ID }}
          # For EU cloud:
          # host: https://eu.posthog.com

      - name: Deploy
        env:
          POSTHOG_RELEASE_ID: ${{ steps.posthog-release.outputs.release-id }}
        # TODO: no deploy mechanism is wired up. See README or your host's
        # config for how the image actually gets rolled out.
        run: echo "Deploy not configured. POSTHOG_RELEASE_ID=$POSTHOG_RELEASE_ID"
