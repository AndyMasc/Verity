services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # Migrations + staticfiles on start (single-node Hetzner deploy), then serve
    # the ASGI app with uvicorn's worker — matches Procfile's `web` process.
    command: >
      sh -c "python manage.py migrate --noinput &&
              python manage.py collectstatic --noinput &&
              gunicorn Papertrail.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - coolify-infra
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/core/health/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # Background worker for handling Dramatiq actors/tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # Reuses the same build but overrides the web server command
    command: python manage.py rundramatiq --processes=2 --threads=4
    env_file:
      - .env
    networks:
      - coolify-infra

  # Scheduler for running periodic/cron tasks via Periodiq
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # Periodiq hooks into existing dramatiq codebase
    command: python manage.py runperiodiq
    env_file:
      - .env
    networks:
      - coolify-infra

networks:
  coolify-infra:
    external: true
