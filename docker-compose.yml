# MESSAGE BROKER AND CACHE ARE ONE CLICK DEPLOYED VIA DOKPLOY/COOLIFY. DATABASE IS HOSTED FOR COMPLIANCE
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: main-image:latest # Specific name of built image so others can reuse it
    restart: always
# Uvicorn is async, so 2-4 workers can handle lots of concurrent requests.
    command: >
      sh -c "
      cd /app
      set -e
      python manage.py migrate --noinput --skip-checks
      python manage.py collectstatic --noinput --skip-checks
      exec python -O -m uvicorn Verity.asgi:application --host 0.0.0.0 --port 8000 --workers 4 --timeout-keep-alive 5 --log-level warning
      "
    expose:
      - "8000"
    environment:
      - PYTHON_JIT=1
    env_file:
      - .env
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '1.0'
          memory: 768M

  # Background worker for handling Dramatiq actors/tasks
  worker:
    image: main-image:latest # Reuses web image, rather than building a brand new one
    restart: always
    command: sh -c "cd /app && python manage.py rundramatiq --skip-checks --processes 2 --threads 8 -Q default ocr-tasks maintenance"
    env_file:
      - .env
    networks:
      - dokploy-network
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '1.0'
          memory: 1024M

  # Scheduler for running periodic/cron tasks via Periodiq
  scheduler:
    image: main-image:latest # Reuses web image, rather than building a brand new one
    restart: always
    command: sh -c "cd /app && python manage.py runperiodiq --skip-checks"
    env_file:
      - .env
    networks:
      - dokploy-network
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

networks: # Since using dokploy 1 click lamq mq and valkey, connect via shared external networks.
  dokploy-network:
    external: true