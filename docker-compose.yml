# MESSAGE BROKER AND CACHE ARE ONE CLICK DEPLOYED VIA DOKPLOY/COOLIFY. DATABASE IS HOSTED FOR COMPLIANCE
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: main-image:latest # Specific name of built image so others can reuse it
    restart: always
    # Uvicorn is async, so 2 workers can lots of concurrent requests.
    # Run migrations and static collection with --skip-checks so a cache or
    # Stripe hiccup can never take down manage.py (djstripe's system checks
    # query cachalot -> Redis). Both steps are non-fatal so a transient R2
    # upload or DB hiccup never crash-loops the web container (which kills
    # worker/scheduler dependencies too). `exec` keeps uvicorn as PID 1 so
    # signals (stop/restart) are handled cleanly.
    command: >
      sh -c "
      python manage.py migrate --noinput --skip-checks || echo 'WARN: migrate failed - continuing';
      python manage.py collectstatic --noinput --skip-checks || echo 'WARN: collectstatic failed - continuing';
      exec python -O -m uvicorn Verity.asgi:application --host 0.0.0.0 --port 8000 --workers 4 --timeout-keep-alive 5 --log-level warning
      "
    expose:
      - "8000"
    environment:
      - PYTHON_JIT=1
    env_file:
      - .env
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/core/health/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Background worker for handling Dramatiq actors/tasks
  worker:
    image: main-image:latest # Reuses web image, rather than building a brand new one
    restart: always
    command: python manage.py rundramatiq --processes=2 --threads=8 --prefetch=2 --max-tasks=5000
    env_file:
      - .env
    networks:
      - dokploy-network
    depends_on:
      web:
        condition: service_healthy

  # Scheduler for running periodic/cron tasks via Periodiq
  scheduler:
    image: main-image:latest # Reuses web image, rather than building a brand new one
    restart: always
    command: python manage.py runperiodiq
    env_file:
      - .env
    depends_on:
      web:
        condition: service_healthy

networks: # Since using dokploy 1 click lavin mq and valkey, we need to connect to the external dokploy network so they can communicate with each other.
  dokploy-network:
    external: true