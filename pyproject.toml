[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade (upgrades syntax to Python 3.14 rules)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "RSE",  # flake8-raise
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print
    "Q",    # flake8-quotes
    "PIE",  # flake8-pie
    "DJ",   # flake8-django (Optimised rules specifically for Django)
    "S",    # flake8-bandit (Replaces the standalone tool.bandit configuration)
    "PERF", # Perflint (Finds performance antipatterns in loops)
    "RUF",  # Ruff-specific rules
]
# EN DASH is intentional typography in currency/display labels.
allowed-confusables = ["–"]
ignore = [
    "E501",  # line too long (handled automatically by format section)
    "N802",  # function name should be lowercase (Django views use snake_case)
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
    "N999",  # Verity package name exception
]

[tool.ruff.lint.per-file-ignores]
# Added trailing asterisks so nested migration folders and test files match completely
"**/migrations/**" = ["ALL"]
"**/tests/**" = ["ALL"]
"**/test_*.py" = ["ALL"]
"**/tests.py" = ["ALL"]

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["core", "documents", "records", "plaid_integration", "Verity", "accounting", "billing"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# Use valid relative path regex syntax for Mypy exclusions
exclude = [
    "migrations/",
    "tests/",
    "venv/",
    "__pycache__/",
    "manage.py",
    "conftest.py"
]

# Structural catch-all for untyped third-party libraries missing stubs
[[tool.mypy.overrides]]
module = [
    "django.*",
    "webpush.*",
    "anymail.*",
    "allauth.*",
    "django_filters.*",
    "django_ratelimit.*",
    "boto3.*",
    "botocore.*",
    "PIL.*",
    "filetype.*",
    "numpy.*",
    "cv2.*",
    "deskew.*",
    "reimbursements.*",
    "djstripe.*",
    "stripe.*",
    "cachalot.*",
    "environ",
    "fernet_fields",
    "periodiq",
    "pillow_heif.*",
    "plaid.*",
    "rest_framework.*",
    "simple_history",
    "django_dramatiq",
    "django_periodiq",
    "import_export",
    "openpyxl"
]
ignore_missing_imports = true

# Catch-all for internal Django modules to suppress specific framework noise
[[tool.mypy.overrides]]
module = [
    "*.models",
    "Verity.*",
    "documents.*",
    "core.*",
    "records.*",
    "plaid_integration.*",
    "accounting.*",
    "billing.*",
    "reimbursements.*"
]
ignore_missing_imports = true
disable_error_code = [
    "no-untyped-def", 
    "return-value", 
    "arg-type", 
    "union-attr", 
    "assignment", 
    "unused-ignore", 
    "attr-defined", 
    "var-annotated", 
    "dict-item",
    "valid-type",
    "misc"
]

[tool.coverage.run]
source = ["core", "documents", "records", "plaid_integration"]
omit = ["*/migrations/*", "*/tests/*", "*/test_*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "Verity.settings.local"
python_files = ["tests.py", "test_*.py", "tests_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
    "--numprocesses=auto",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]
