services:
  # 1. THE DJANGO WEB APPLICATION
  - type: web
    name: papertrail-web
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn Papertrail.wsgi --log-file -"
    envVars:
      - key: DEBUG
        value: "0"
      - key: DJANGO_SETTINGS_MODULE
        value: "Papertrail.settings.production"
      - key: DATABASE_URL
        fromDatabase:
          name: papertrail-db
          property: connectionString
      - key: REDIS_URL
        fromKeyValue:
          name: papertrail-redis
          property: connectionString

  # 2. THE MANAGED REDIS INSTANCE (Placed correctly inside the services list)
  - type: keyvalue
    name: papertrail-redis
    plan: free 

# 3. NATIVE MANAGED POSTGRES DATABASE
databases:
  - name: papertrail-db
    plan: free
