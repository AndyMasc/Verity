services:
  # 1. THE DJANGO WEB APPLICATION (Handles Web views + QStash Webhooks)
  - type: web
    name: papertrail-web
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn Papertrail.wsgi --log-file -"
    envVars:
      - key: DEBUG
        value: "0"
      - key: DJANGO_SETTINGS_MODULE
        value: "Papertrail.settings.production"
      - key: DATABASE_URL
        fromDatabase:
          name: papertrail-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: papertrail-redis
          property: connectionString

# 2. NATIVE MANAGED POSTGRES DATABASE
databases:
  - name: papertrail-db
    plan: free

# 3. NATIVE MANAGED REDIS INSTANCE
redis:
  - name: papertrail-redis
    plan: free
