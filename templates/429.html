<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Too Many Requests | Papertrail</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: 'media',
            }
        </script>
    </head>
    <body class="font-sans bg-[#fcfcfc] dark:bg-[#0c0c0e] text-[#111827] dark:text-[#f4f4f5] min-h-screen flex items-center justify-center antialiased selection:bg-zinc-200 dark:selection:bg-zinc-800">
        <div class="relative w-full max-w-[24rem] mx-4 p-10 bg-white dark:bg-[#141416] border border-zinc-200 dark:border-white/[0.08] rounded-lg shadow-[0_4px_6px_-1px_rgba(0,0,0,0.02),0_2px_4px_-2px_rgba(0,0,0,0.02)] dark:shadow-[0_20px_25px_-5px_rgba(0,0,0,0.5),0_8px_10px_-6px_rgba(0,0,0,0.5)] text-left">
            <div class="inline-flex items-center justify-center w-10 h-10 mb-6 bg-[#f9fafb] dark:bg-white/[0.04] border border-zinc-200 dark:border-white/[0.08] rounded-md text-zinc-600 dark:text-[#a1a1aa]">
                <svg class="w-[1.125rem] h-[1.125rem]"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="1.75">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h1 class="text-[1.125rem] font-medium tracking-tight mb-1.5">Too many requests</h1>
            <p class="text-sm text-zinc-500 dark:text-[#9b9ba1] leading-relaxed mb-8">
                You have exceeded the rate limit. Please wait a moment before attempting your request again.
            </p>
            <button onclick="window.location.reload();"
                    class="inline-flex items-center justify-center w-full px-4 py-2 text-sm font-medium text-white dark:text-[#0c0c0e] bg-[#111827] dark:bg-[#f4f4f5] hover:bg-[#1f2937] dark:hover:bg-white rounded-md transition-colors duration-150 active:opacity-95 cursor-pointer border-0">
                Try again
            </button>
        </div>
    </body>
</html>
