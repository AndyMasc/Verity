{# Reusable search input for list filtering pages. #}
{# Expects: search_url (required URL), search_placeholder (optional). #}
<div class="group relative w-full">
    <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-zinc-400 dark:text-zinc-500">
        <svg class="h-4 w-4"
             fill="none"
             viewBox="0 0 24 24"
             stroke-width="1.5"
             stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
    </span>
    <input id="search"
           name="search"
           type="search"
           placeholder="{{ search_placeholder|default:'Search...' }}"
           class="shadow-2xs w-full rounded-xl border border-zinc-200 bg-white py-2.5 pr-4 pl-10 text-xs font-normal text-zinc-900 placeholder-zinc-400 transition-all focus:border-zinc-900 focus:ring-1 focus:ring-zinc-900 focus:outline-none dark:border-zinc-800/60 dark:bg-zinc-900/45 dark:text-zinc-100 dark:placeholder-zinc-500 dark:focus:border-zinc-400 dark:focus:ring-zinc-400"
           hx-get="{{ search_url }}"
           hx-trigger="input changed delay:300ms, keyup[key=='Enter'], search"
           hx-target="#query-results-container"
           hx-indicator=".htmx-indicator"
           hx-include="#filter-form">
</div>
