<div id="django-messages-toast" class="z-9999">
    {% for message in messages %}
        {% include "core/toast_markup.html" with toast_text=message.message toast_level=message.level %}
    {% endfor %}
    {# Cloned by the script below for messages that arrive after page load. #}
    <template id="toast-markup-template">
        {% include "core/toast_markup.html" with toast_text="" toast_level=25 %}
    </template>
    <script>
        (function () {
            const container = document.getElementById('django-messages-toast');
            const template = document.getElementById('toast-markup-template');
            if (!container || !template) return;

            window.addEventListener('django-messages', function (event) {
                const { message, level } = event.detail || {};
                if (message === undefined || message === null) return;

                const node = template.content.firstElementChild.cloneNode(true);
                node.dataset.text = message;
                node.dataset.level = String(level == null ? 25 : level);
                container.insertBefore(node, template);
            });
        })();
    </script>
</div>
