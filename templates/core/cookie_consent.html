<div id="cookie-consent-panel"
     class="fixed right-5 bottom-5 z-50 w-full max-w-xs p-1 antialiased"
     hidden>
    <div class="relative overflow-hidden rounded-xl border border-zinc-200/80 bg-white/80 p-4 shadow-xl backdrop-blur-md transition-all dark:border-white/10 dark:bg-zinc-900/80 dark:shadow-2xl dark:shadow-black/60">
        <div class="absolute inset-x-0 top-0 h-[1px] bg-gradient-to-r from-transparent via-zinc-400/20 to-transparent dark:via-white/20">
        </div>
        <div class="flex items-center justify-between">
            <h2 class="text-xs font-semibold tracking-wider text-zinc-900 dark:text-zinc-100">We use cookies.</h2>
        </div>
        <p class="mt-2 text-xs leading-relaxed text-zinc-500 dark:text-zinc-400">
            We use telemetry to optimize speed and experience. Read our
            <a href="{% url 'docs:privacy_policy' %}"
               class="font-medium text-zinc-900 underline decoration-zinc-300 underline-offset-2 transition-colors hover:decoration-zinc-900 dark:text-zinc-200 dark:decoration-zinc-700 dark:hover:decoration-zinc-200">
                Privacy Policy.
            </a>
        </p>
        <div class="mt-4 flex items-center gap-2">
            <button type="button"
                    data-cookie-action="allow"
                    class="inline-flex w-full items-center justify-center rounded-lg bg-zinc-900 px-3 py-1.5 text-xs font-medium text-white shadow-sm transition-all hover:bg-zinc-800 active:scale-[0.98] dark:bg-zinc-100 dark:text-zinc-900 dark:hover:bg-white">
                Accept all
            </button>
            <button type="button"
                    data-cookie-action="reject"
                    class="inline-flex w-full items-center justify-center rounded-lg border border-zinc-200 bg-transparent px-3 py-1.5 text-xs font-medium text-zinc-700 transition-all hover:bg-zinc-100/80 active:scale-[0.98] dark:border-zinc-700 dark:text-zinc-400 dark:hover:bg-zinc-900/60">
                Decline
            </button>
        </div>
    </div>
</div>
<script>
    (function () {
        'use strict';
        var STORAGE_KEY = 'verity_cookie_consent';
        var panel = document.getElementById('cookie-consent-panel');
        if (!panel) return;

        function getConsent() {
            try { return window.localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
        }

        function setConsent(value) {
            try { window.localStorage.setItem(STORAGE_KEY, value); } catch (e) {}
        }

        function dismiss() {
            panel.remove();
        }

        if (getConsent()) {
            dismiss();
            return;
        }

        panel.hidden = false;

        var dismissBtn = document.getElementById('cookie-consent-dismiss');
        if (dismissBtn) dismissBtn.addEventListener('click', dismiss);

        document.querySelectorAll('[data-cookie-action]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var action = btn.getAttribute('data-cookie-action');
                if (action === 'allow') {
                    setConsent('allowed');
                    if (window.posthog && typeof window.posthog.opt_in_capturing === 'function') {
                        window.posthog.opt_in_capturing();
                    }
                    dismiss();
                } else if (action === 'reject') {
                    setConsent('rejected');
                    if (window.posthog && typeof window.posthog.opt_out_capturing === 'function') {
                        window.posthog.opt_out_capturing();
                    }
                    dismiss();
                } else {
                    dismiss();
                }
            });
        });
    })();
</script>
