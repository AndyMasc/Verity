<div id="cookie-consent-panel"
     class="fixed right-5 bottom-5 z-50 w-full max-w-sm p-1 antialiased"
     hidden>
    <div class="flex gap-3 overflow-hidden rounded-xl border border-zinc-200/80 bg-white/80 p-4 shadow-xl backdrop-blur-md transition-all dark:border-white/10 dark:bg-zinc-900/80 dark:shadow-2xl dark:shadow-black/60">
        <div class="absolute inset-x-0 top-0 h-[1px] bg-gradient-to-r from-transparent via-zinc-400/20 to-transparent dark:via-white/20">
        </div>
        <svg xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke-width="1.5"
             stroke="currentColor"
             class="size-7">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
        </svg>
        <div>
            <p class="text-xs leading-relaxed text-black dark:text-white">
                We use cookies to optimize our platform, and improve your experience. Read our
                <a href="{% url 'docs:privacy_policy' %}"
                   class="font-medium text-zinc-900 underline decoration-zinc-300 underline-offset-2 transition-colors hover:decoration-zinc-900 dark:text-zinc-200 dark:decoration-zinc-700 dark:hover:decoration-zinc-200">
                    Privacy Policy.
                </a>
            </p>
            <div class="mt-3 flex w-min items-center gap-2">
                <button type="button"
                        data-cookie-action="allow"
                        class="inline-flex w-full cursor-pointer items-center justify-center rounded-lg border border-zinc-200 bg-transparent px-2 py-1 text-xs font-medium whitespace-nowrap text-zinc-800 transition-all hover:bg-zinc-100/80 active:scale-[0.98] dark:border-zinc-700 dark:text-zinc-300 dark:hover:bg-zinc-800">
                    Accept all
                </button>
                <button type="button"
                        data-cookie-action="reject"
                        class="inline-flex w-full cursor-pointer items-center justify-center rounded-lg border border-zinc-200 bg-transparent px-2 py-1 text-xs font-medium whitespace-nowrap text-zinc-800 transition-all hover:bg-zinc-100/80 active:scale-[0.98] dark:border-zinc-700 dark:text-zinc-300 dark:hover:bg-zinc-800">
                    Decline all
                </button>
            </div>
        </div>
    </div>
</div>
<script>
    (function () {
        'use strict';
        var STORAGE_KEY = 'cookie_consent';
        var panel = document.getElementById('cookie-consent-panel');
        if (!panel) return;

        function getConsent() {
            try { return window.localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
        }

        function setConsent(value) {
            try { window.localStorage.setItem(STORAGE_KEY, value); } catch (e) {}
        }

        function dismiss() {
            panel.remove();
        }

        if (getConsent()) {
            dismiss();
            return;
        }

        panel.hidden = false;

        var dismissBtn = document.getElementById('cookie-consent-dismiss');
        if (dismissBtn) dismissBtn.addEventListener('click', dismiss);

        document.querySelectorAll('[data-cookie-action]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var action = btn.getAttribute('data-cookie-action');
                if (action === 'allow') {
                    setConsent('allowed');
                    if (window.posthog && typeof window.posthog.opt_in_capturing === 'function') {
                        window.posthog.opt_in_capturing();
                    }
                    dismiss();
                } else if (action === 'reject') {
                    setConsent('rejected');
                    if (window.posthog && typeof window.posthog.opt_out_capturing === 'function') {
                        window.posthog.opt_out_capturing();
                    }
                    // Stop handing the PostHog session id to the backend.
                    document.cookie = 'posthog_session_cookie=; path=/; max-age=0; samesite=lax';
                    dismiss();
                } else {
                    dismiss();
                }
            });
        });
    })();
</script>
