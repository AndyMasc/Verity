<div class="container mx-auto mt-4 pt-1">
    <div class="mx-auto flex w-11/12 max-w-lg flex-col rounded-2xl border border-zinc-200/80 bg-zinc-100 px-10 py-12 shadow-xs backdrop-blur-md md:w-4/5 lg:w-2/3 xl:w-1/2 dark:border-zinc-800/30 dark:bg-zinc-900/40">
        <h1 class="mb-3 text-2xl leading-tight font-semibold tracking-tight text-zinc-900 dark:text-zinc-50">{{ heading }}</h1>
        {% if subheading %}
            <p class="mb-3 text-sm text-zinc-600 dark:text-zinc-400">{{ subheading }}</p>
        {% endif %}
        {{ children }}
    </div>
</div>
