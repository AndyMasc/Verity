<div class="container mx-auto mt-4 pt-1">
    <div class="mx-auto flex w-11/12 max-w-md flex-col p-10 md:w-4/5 lg:w-2/3 xl:w-1/2">
        <h1 class="mb-3 text-center text-3xl leading-tight font-semibold tracking-tight text-zinc-900 dark:text-zinc-50">{{ heading }}</h1>
        {% if subheading %}
            <p class="mb-3 text-center text-sm text-zinc-500 dark:text-zinc-400">{{ subheading }}</p>
        {% endif %}
        {{ children }}
    </div>
</div>
