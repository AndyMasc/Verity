<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>500 - Server Error | Verity</title>
        <style>
            *, *::before, *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                background-color: #fafafa;
                color: #18181b;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background-color: #0e0e0e;
                    color: #fafafa;
                }
                .card {
                    border-color: #27272a;
                    background-color: #18181b;
                }
                .badge {
                    border-color: rgba(39, 39, 42, 0.4);
                    background-color: rgba(39, 39, 42, 0.3);
                    color: #a1a1aa;
                }
                .dot {
                    background-color: #71717a;
                }
                .subtitle {
                    color: #a1a1aa;
                }
                .btn-secondary {
                    border-color: #27272a;
                    background-color: #18181b;
                    color: #d4d4d8;
                }
                .btn-secondary:hover {
                    background-color: #27272a;
                }
                .btn-primary {
                    background-color: #fafafa;
                    color: #09090b;
                }
                .btn-primary:hover {
                    background-color: #e4e4e7;
                }
            }
            .container {
                width: 100%;
                max-width: 28rem;
                padding: 2rem 1.5rem;
                text-align: center;
            }
            .badge {
                display: inline-flex;
                align-items: center;
                padding: 0.25rem 0.75rem;
                gap: 0.5rem;
                border: 1px solid rgba(228, 228, 231, 0.4);
                border-radius: 0.75rem;
                background-color: #f4f4f5;
                color: #71717a;
                font-weight: 500;
                font-size: 0.6875rem;
                letter-spacing: 0.05em;
                text-transform: uppercase;
            }
            .dot {
                width: 0.375rem;
                height: 0.375rem;
                border-radius: 50%;
                background-color: #a1a1aa;
            }
            h1 {
                margin-top: 1.5rem;
                font-weight: 700;
                font-size: 2.25rem;
                letter-spacing: -0.025em;
            }
            .subtitle {
                max-width: 20rem;
                margin-top: 0.75rem;
                margin-right: auto;
                margin-left: auto;
                color: #71717a;
                font-size: 0.875rem;
                line-height: 1.625;
            }
            .actions {
                display: flex;
                flex-direction: column;
                justify-content: center;
                margin-top: 2rem;
                gap: 0.75rem;
            }
            @media (min-width: 640px) {
                .actions {
                    flex-direction: row;
                }
            }
            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 0.5rem 1rem;
                gap: 0.375rem;
                border: none;
                border-radius: 1rem;
                font-weight: 500;
                font-size: 0.75rem;
                text-decoration: none;
                cursor: pointer;
                transition: all 0.15s;
            }
            .btn-secondary {
                border: 1px solid #e4e4e7;
            }
            .btn-primary {
                background-color: #18181b;
                color: white;
            }
            .btn-primary:hover {
                background-color: #27272a;
            }
            .btn-secondary:hover {
                background-color: #f4f4f5;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="badge">
                <span class="dot" aria-hidden="true"></span>
                Error 500
            </div>
            <h1>Server error.</h1>
            <div class="actions">
                <a href="/" class="btn btn-secondary">
                    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                    </svg>
                    Go Back
                </a>
            </div>
        </div>
    </body>
</html>
