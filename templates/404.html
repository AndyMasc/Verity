{% extends "base.html" %}
{% block title %}404 - Page Not Found | Verity{% endblock %}
{% block content %}
    <main class="flex min-h-[calc(100vh-12rem)] items-center justify-center px-6 py-24">
        <div class="w-full max-w-md space-y-8 text-center">
            <div class="inline-flex items-center gap-2 rounded-xl border border-zinc-200/40 bg-zinc-50 px-3 py-1 text-[11px] font-medium tracking-wider text-zinc-500 uppercase dark:border-zinc-800/30 dark:bg-zinc-800/30 dark:text-zinc-400">Error 404</div>
            <div class="space-y-3">
                <h1 class="text-4xl font-bold tracking-tight text-zinc-900 sm:text-5xl dark:text-zinc-50">Page not found.</h1>
                <p class="mx-auto max-w-xs text-sm leading-relaxed text-zinc-500 dark:text-zinc-400">The page you are looking for doesn't exist or has been moved to another record archive.</p>
            </div>
            <div class="flex flex-col items-center justify-center gap-3 sm:flex-row">
                <a href="javascript:history.back()"
                   class="inline-flex w-2xs items-center justify-center gap-1.5 rounded-2xl border border-zinc-200 bg-white px-4 py-2 text-xs font-medium text-zinc-700 shadow-xs transition-all duration-200 hover:bg-zinc-50 active:scale-[0.98] sm:w-auto dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-300 dark:hover:bg-zinc-800">
                    <svg class="h-3.5 w-3.5"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="2"
                         stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                    </svg>
                    Go Back
                </a>
            </div>
        </div>
    </main>
{% endblock %}
