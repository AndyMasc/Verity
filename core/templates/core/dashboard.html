{% extends "base.html" %}
{% load form_tags %}

{% block title %}Dashboard | Papertrail{% endblock %}

{% block content %}
    {% include 'core/partials/dashboard_content.html' %}

    <script>
        (function() {
            var refreshOnShow = function(e) {
                if (e.persisted) {
                    var main = document.getElementById('dashboard-content');
                    if (main && !main.closest('.htmx-request')) {
                        htmx.trigger(main, 'recordChanged');
                    }
                }
            };
            window.addEventListener('pageshow', refreshOnShow);
        })();
    </script>
{% endblock %}
