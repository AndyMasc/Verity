{% load humanize %}
<tr id="notification-{{ notification.id }}"
    class="group border-b border-zinc-100 dark:border-zinc-800/50 transition-colors duration-150
           {% if notification.is_read %}bg-transparent{% else %}bg-zinc-50/50 dark:bg-zinc-800/20{% endif %}
           hover:bg-zinc-50 dark:hover:bg-zinc-800/30">
    <td class="px-5 py-4 w-8 align-middle">
        {% if not notification.is_read %}
            <span class="block w-2 h-2 rounded-full bg-blue-500 shrink-0"></span>
        {% endif %}
    </td>
    <td class="px-5 py-4 align-middle">
        <div class="flex flex-col gap-0.5">
            {% if notification.subject %}
                <p class="text-[13px] font-medium text-zinc-900 dark:text-zinc-100 leading-snug">
                    {{ notification.subject }}
                </p>
            {% endif %}
            <p class="text-[13px] text-zinc-500 dark:text-zinc-400 leading-snug">
                {{ notification.message }}
            </p>
        </div>
    </td>
    <td class="px-5 py-4 text-right align-middle whitespace-nowrap">
        <span class="text-[11px] text-zinc-400 dark:text-zinc-500 tabular-nums">
            {{ notification.sent_at|timesince }} ago
        </span>
    </td>
    <td class="px-5 py-4 align-middle">
        <div class="flex items-center justify-end gap-1 opacity-0 group-hover:opacity-100 transition-opacity duration-150">
            <form method="post" action="{% url 'core:notification-mark-read' notification.id %}"
                  hx-post="{% url 'core:notification-mark-read' notification.id %}"
                  hx-target="#notification-{{ notification.id }}"
                  hx-swap="outerHTML">
                {% csrf_token %}
                <button type="submit" title="{% if notification.is_read %}Mark unread{% else %}Mark read{% endif %}"
                    class="p-1.5 rounded-lg text-zinc-400 dark:text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-all duration-150 cursor-pointer">
                    {% if notification.is_read %}
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
                        </svg>
                    {% else %}
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/>
                        </svg>
                    {% endif %}
                </button>
            </form>
            <form method="post" action="{% url 'core:notification-delete' notification.id %}"
                  hx-delete="{% url 'core:notification-delete' notification.id %}"
                  hx-target="#notification-{{ notification.id }}"
                  hx-swap="outerHTML swap:1s"
                  hx-confirm="Delete this notification?">
                {% csrf_token %}
                <button type="submit" title="Delete"
                    class="p-1.5 rounded-lg text-zinc-400 dark:text-zinc-500 hover:text-red-600 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 transition-all duration-150 cursor-pointer">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
                    </svg>
                </button>
            </form>
        </div>
    </td>
</tr>
