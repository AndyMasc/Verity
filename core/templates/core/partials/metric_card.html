{% load form_tags %}
{% if metric.url %}
    <a href="{{ metric.url }}"
       class="group relative p-5 rounded-2xl bg-white dark:bg-zinc-900/40 border border-zinc-200 dark:border-zinc-800/60 hover:border-zinc-300 dark:hover:border-zinc-700 hover:shadow-sm transition-all duration-200 flex flex-col justify-between shadow-2xs focus:outline-none focus:ring-2 focus:ring-zinc-900 dark:focus:ring-white/40">
    {% else %}
        <div class="group relative p-5 rounded-2xl bg-white dark:bg-zinc-900/40 border border-zinc-200 dark:border-zinc-800/60 flex flex-col justify-between shadow-2xs transition-all duration-200">
        {% endif %}
        <div class="flex items-center justify-between">
            <span class="text-[11px] font-semibold text-zinc-500 dark:text-zinc-400 tracking-wider uppercase">{{ metric.label }}</span>
        </div>
        <div class="mt-2 flex items-baseline gap-2">
            <span class="text-2xl font-semibold tracking-tight text-zinc-950 dark:text-zinc-50 tabular-nums">
                {% if metric.currency %}{{ metric.value|currency_format:metric.currency }}{% else %}{{ metric.value }}{% endif %}
            </span>
            {% if metric.subtext %}
                <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400">{{ metric.subtext }}</span>
            {% endif %}
        </div>
        {% if metric.url %}
        </a>
    {% else %}
    </div>
{% endif %}
