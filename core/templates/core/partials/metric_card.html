{% load form_tags %}
{% if metric.url %}
    <a href="{{ metric.url }}"
       class="group shadow-2xs relative flex flex-col justify-between rounded-2xl border border-zinc-200 bg-white p-5 transition-all duration-200 hover:border-zinc-300 hover:shadow-sm focus:ring-2 focus:ring-zinc-900 focus:outline-none dark:border-zinc-800/30 dark:bg-zinc-900/45 dark:hover:border-zinc-800">
    {% else %}
        <div class="group shadow-2xs relative flex flex-col justify-between rounded-2xl border border-zinc-200 bg-white p-5 transition-all duration-200 dark:border-zinc-800/30 dark:bg-zinc-900/45">
        {% endif %}
        <div class="flex items-center justify-between">
            <span class="text-[11px] font-semibold tracking-wider text-zinc-600 uppercase dark:text-zinc-400">{{ metric.label }}</span>
        </div>
        <div class="mt-2 flex items-baseline gap-2">
            <span class="text-2xl font-semibold tracking-tight text-zinc-950 tabular-nums dark:text-zinc-50">
                {% if metric.currency %}{{ metric.value|currency_format:metric.currency }}{% else %}{{ metric.value }}{% endif %}
            </span>
            {% if metric.subtext %}
                <span class="text-xs font-medium text-zinc-600 dark:text-zinc-400">{{ metric.subtext }}</span>
            {% endif %}
        </div>
        {% if metric.url %}
        </a>
    {% else %}
    </div>
{% endif %}
