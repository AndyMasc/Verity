{% load form_tags %}
<section class="grid grid-cols-1 md:grid-cols-3 gap-5">
    <a href="{% filter_url 'records:view_all_records' this_month='True' %}"
       class="group relative p-5 rounded-2xl bg-zinc-100/80 dark:bg-zinc-900/70 border border-zinc-200/40 dark:border-white/[0.03] hover:border-zinc-300/60 dark:hover:border-white/[0.06] transition-all flex flex-col justify-between shadow-2xs">
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Expenses</span>
            <span class="text-[11px] font-medium text-zinc-400 group-hover:text-zinc-700 dark:group-hover:text-zinc-200 transition-colors">{% now "F" %} &rarr;</span>
        </div>
        <div class="mt-4">
            <span class="text-2xl font-semibold tracking-tight text-zinc-900 dark:text-zinc-100">
                {{ monthly_expenses|default:0|currency_format:user.settings.default_currency }}
            </span>
        </div>
    </a>
    <a href="{% filter_url 'records:view_all_records' expiring_soon='True' %}"
       class="group relative p-5 rounded-2xl bg-zinc-100/80 dark:bg-zinc-900/70 border border-zinc-200/40 dark:border-white/[0.03] hover:border-zinc-300/60 dark:hover:border-white/[0.06] transition-all flex flex-col justify-between shadow-2xs">
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Expiring Soon</span>
            <span class="text-[11px] font-medium text-zinc-400 group-hover:text-zinc-700 dark:group-hover:text-zinc-200 transition-colors">View &rarr;</span>
        </div>
        <div class="mt-4 flex items-baseline gap-2">
            <span class="text-2xl font-semibold tracking-tight text-zinc-900 dark:text-zinc-100">{{ expiring_soon_count }}</span>
            <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400">record{{ expiring_soon_count|pluralize }}</span>
        </div>
    </a>
    <a href="{% url 'records:merge_list' %}"
       class="group relative p-5 rounded-2xl bg-zinc-100/80 dark:bg-zinc-900/70 border border-zinc-200/40 dark:border-white/[0.03] hover:border-zinc-300/60 dark:hover:border-white/[0.06] transition-all flex flex-col justify-between shadow-2xs">
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Matched Entries</span>
            <span class="text-[11px] font-medium text-zinc-400 group-hover:text-zinc-700 dark:group-hover:text-zinc-200 transition-colors">Review &rarr;</span>
        </div>
        <div class="mt-4 flex items-baseline gap-2">
            <span class="text-2xl font-semibold tracking-tight text-zinc-900 dark:text-zinc-100">{{ merged_records_count }}</span>
            <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400">matches</span>
        </div>
    </a>
</section>
