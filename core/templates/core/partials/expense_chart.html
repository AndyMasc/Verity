<div x-data="expenseChart()"
     x-cloak
     x-init="init()"
     class="relative flex flex-col h-full w-full">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 shrink-0">
        <div>
            <h3 class="text-sm font-semibold tracking-tight text-zinc-900 dark:text-zinc-50">Expense Trends</h3>
            <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5"
               x-text="summary"></p>
        </div>
        <div class="flex items-center gap-1 p-1 rounded-xl bg-zinc-100/80 dark:bg-zinc-800/50 border border-zinc-200/50 dark:border-zinc-700/40 self-start sm:self-auto">
            <template x-for="p in periods" :key="p.value">
                <button @click="load(p.value)"
                        :class="period === p.value ? 'bg-white dark:bg-zinc-700 text-zinc-900 dark:text-zinc-50 shadow-xs' : 'text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200'"
                        class="px-2.5 py-1 text-[11px] font-medium rounded-lg transition-all duration-150 active:scale-[0.97]"
                        x-text="p.label"></button>
            </template>
        </div>
    </div>
    <div class="relative flex-1 w-full min-h-[220px]">
        <canvas x-ref="canvas"
                class="absolute inset-0 w-full h-full cursor-crosshair"
                @mousemove="onHover($event)"
                @mouseleave="tooltip.visible = false"></canvas>
        <!-- Empty State Layer -->
        <div x-show="data.length === 0 && !loading"
             x-cloak
             class="absolute inset-0 flex flex-col items-center justify-center text-center p-6">
            <div class="size-9 rounded-full bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center text-zinc-400 dark:text-zinc-500 mb-2">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round5" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
            </div>
            <p class="text-xs font-medium text-zinc-700 dark:text-zinc-300">No expense data available</p>
            <p class="text-[11px] text-zinc-400 dark:text-zinc-500 mt-0.5">Trends will appear here once data is available.</p>
        </div>
        {# Tooltip #}
        <div x-show="tooltip.visible"
             x-transition:enter="transition ease-out duration-150"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100"
             x-transition:leave="transition ease-in duration-100"
             x-transition:leave-start="opacity-100 scale-100"
             x-transition:leave-end="opacity-0 scale-95"
             x-cloak
             class="absolute z-20 pointer-events-none"
             :style="`left: ${tooltip.x}px; top: ${tooltip.y}px; transform: translate(-50%, -100%) translateY(-8px);`">
            <div class="px-3 py-1.5 rounded-xl bg-zinc-900 dark:bg-zinc-800 text-white shadow-xl border border-zinc-700/50 dark:border-zinc-700">
                <div class="text-[10px] font-medium text-zinc-400 uppercase tracking-wider"
                     x-text="tooltip.label"></div>
                <div class="text-xs font-semibold tabular-nums mt-0.5"
                     x-text="tooltip.value"></div>
            </div>
        </div>
    </div>
    {# Loading overlay #}
    <div x-show="loading"
         class="absolute inset-0 flex items-center justify-center bg-white/40 dark:bg-zinc-900/40 backdrop-blur-xs z-10 rounded-2xl transition-opacity">
        <div class="flex items-center gap-2 text-xs font-medium text-zinc-700 dark:text-zinc-300 px-3 py-1.5 bg-white dark:bg-zinc-800 rounded-full shadow-sm border border-zinc-200/60 dark:border-zinc-700/60">
            <svg class="animate-spin h-3.5 w-3.5 text-zinc-600 dark:text-zinc-300"
                 viewBox="0 0 24 24"
                 fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            Updating...
        </div>
    </div>
</div>
<script>
    function expenseChart() {
        return {
            data: [],
            currencySymbol: '$',
            period: '1y',
            loading: true,
            periods: [
                { label: '3M', value: '3m' },
                { label: '6M', value: '6m' },
                { label: '1Y', value: '1y' },
                { label: 'All', value: 'all' },
            ],
            tooltip: { visible: false, x: 0, y: 0, label: '', value: '' },
            animation: { progress: 0, frame: null },
            points: [],

            get summary() {
                if (this.data.length === 0) return '';
                const total = this.data.reduce((s, d) => s + d.total, 0);
                const avg = total / this.data.length;
                return `${this.data.length} mo · ${this.currencySymbol}${this.formatNum(total)} total · ${this.currencySymbol}${this.formatNum(avg)}/mo avg`;
            },

            formatNum(n) {
                if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
                if (n >= 1000) return n.toLocaleString('en-US', { maximumFractionDigits: 0 });
                return n.toFixed(2);
            },

            formatCurrency(n) {
                return this.currencySymbol + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            },

            async init() {
                await this.load(this.period);
                window.addEventListener('resize', () => this.draw());
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => this.draw());
            },

            async load(period) {
                this.period = period;
                this.loading = true;
                this.tooltip.visible = false;
                try {
                    const resp = await fetch(`/api/expense-chart/?period=${period}`);
                    const json = await resp.json();
                    this.data = json.months;
                    const currencySymbols = {usd:'$',eur:'€',gbp:'£',cad:'C$',aud:'A$',nzd:'NZ$',chf:'CHF ',jpy:'¥',sek:'kr',nok:'kr',dkk:'kr',pln:'zł',czk:'Kč',huf:'Ft',ron:'lei',brl:'R$',mxn:'MX$',inr:'₹',sgd:'S$',hkd:'HK$',twd:'NT$',krw:'₩',zar:'R',egp:'E£',ngn:'₦',kes:'KSh',ghc:'GH₵',aed:'د.إ',sar:'﷼',qar:'﷼',kwd:'د.ك',bhd:'BD',omr:'﷼',ils:'₪',jod:'JD',lbp:'L£',thb:'฿',myr:'RM',idr:'Rp',php:'₱',vnd:'₫',pkr:'₨',bdt:'৳',lkr:'Rs',npr:'Rs',mmk:'K',rub:'₽',uah:'₴',try:'₺',gel:'₾',azn:'₼',kzt:'₸',uzb:"so'm"};
                    this.currencySymbol = currencySymbols[json.currency] || json.currency?.toUpperCase() + ' ' || '$';
                    this.animateIn();
                } catch (e) {
                    console.error('Chart load failed:', e);
                    this.data = [];
                }
                this.loading = false;
            },

            animateIn() {
                if (this.animation.frame) cancelAnimationFrame(this.animation.frame);
                this.animation.progress = 0;
                const start = performance.now();
                const duration = 800; 
                const tick = (now) => {
                    const elapsed = now - start;
                    this.animation.progress = Math.min(elapsed / duration, 1);
                    this.draw();
                    if (this.animation.progress < 1) {
                        this.animation.frame = requestAnimationFrame(tick);
                    }
                };
                this.animation.frame = requestAnimationFrame(tick);
            },

            draw() {
                const canvas = this.$refs.canvas;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.parentElement.getBoundingClientRect();
                const w = rect.width;
                const h = rect.height;

                canvas.width = w * dpr;
                canvas.height = h * dpr;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                ctx.scale(dpr, dpr);

                ctx.clearRect(0, 0, w, h);

                if (this.data.length === 0) return;

                const padTop = 10;
                const padBottom = 28;
                const padLeft = 0;
                const padRight = 0;
                const chartW = w - padLeft - padRight;
                const chartH = h - padTop - padBottom;

                const maxVal = Math.max(...this.data.map(d => d.total), 1);
                const niceMax = this.niceNum(maxVal);

                const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

                const textColor = isDark ? '#71717a' : '#a1a1aa';
                const gridColor = isDark ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)';
                const lineColor = '#5A67FF';

                const step = chartW / Math.max(this.data.length - 1, 1);
                const ease = this.easeOutExpo(this.animation.progress);

                this.points = [];

                for (let i = 0; i < this.data.length; i++) {
                    const x = this.data.length === 1 ? chartW / 2 : padLeft + i * step;
                    const val = this.data[i].total * ease;
                    const y = padTop + chartH - (val / niceMax) * chartH;
                    this.points.push({ x, y, data: this.data[i] });
                }

                ctx.save();

                // Background Grid Lines
                const gridSteps = 4;
                for (let i = 0; i <= gridSteps; i++) {
                    const y = padTop + (chartH / gridSteps) * i;
                    ctx.beginPath();
                    ctx.strokeStyle = gridColor;
                    ctx.lineWidth = 1;
                    ctx.moveTo(padLeft, y);
                    ctx.lineTo(w - padRight, y);
                    ctx.stroke();

                    const val = niceMax - (niceMax / gridSteps) * i;
                    ctx.fillStyle = textColor;
                    ctx.font = '500 10px "Inter", system-ui, sans-serif';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.formatNum(val), padLeft + chartW, y - 6);
                }

                if (this.points.length < 2) {
                    if (this.points.length === 1) {
                        const p = this.points[0];
                        const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 50);
                        glow.addColorStop(0, isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.08)');
                        glow.addColorStop(1, isDark ? 'rgba(255,255,255,0)' : 'rgba(0,0,0,0)');
                        
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 50, 0, Math.PI * 2);
                        ctx.fillStyle = glow;
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                        ctx.fillStyle = lineColor;
                        ctx.fill();

                        ctx.fillStyle = textColor;
                        ctx.font = '500 11px "Inter", system-ui, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';
                        ctx.fillText(p.data.label, p.x, padTop + chartH + 10);
                    }
                    ctx.restore();
                    return;
                }

                // Enhanced High-Visibility Vertical Gradient Fill
                const grad = ctx.createLinearGradient(0, padTop, 0, padTop + chartH);
                if (isDark) {
                    grad.addColorStop(0, 'rgba(90, 103, 255, 0.45)'); // Much richer color intensity near top
                    grad.addColorStop(0.5, 'rgba(90, 103, 255, 0.15)');
                    grad.addColorStop(1, 'rgba(90, 103, 255, 0)');     // Fades completely clear at the X-axis
                } else {
                    grad.addColorStop(0, 'rgba(90, 103, 255, 0.32)');
                    grad.addColorStop(0.5, 'rgba(90, 103, 255, 0.10)');
                    grad.addColorStop(1, 'rgba(90, 103, 255, 0)');
                }

                ctx.beginPath();
                ctx.moveTo(this.points[0].x, padTop + chartH);
                for (let i = 0; i < this.points.length; i++) {
                    const p = this.points[i];
                    if (i === 0) {
                        ctx.lineTo(p.x, p.y);
                    } else {
                        const prev = this.points[i - 1];
                        const cpx1 = prev.x + step * 0.4;
                        const cpx2 = p.x - step * 0.4;
                        ctx.bezierCurveTo(cpx1, prev.y, cpx2, p.y, p.x, p.y);
                    }
                }
                ctx.lineTo(this.points[this.points.length - 1].x, padTop + chartH);
                ctx.closePath();
                ctx.fillStyle = grad;
                ctx.fill();

                // Main Spline Line
                ctx.beginPath();
                for (let i = 0; i < this.points.length; i++) {
                    const p = this.points[i];
                    if (i === 0) {
                        ctx.moveTo(p.x, p.y);
                    } else {
                        const prev = this.points[i - 1];
                        const cpx1 = prev.x + step * 0.4;
                        const cpx2 = p.x - step * 0.4;
                        ctx.bezierCurveTo(cpx1, prev.y, cpx2, p.y, p.x, p.y);
                    }
                }
                ctx.strokeStyle = lineColor;
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.stroke();

                // X-Axis Labels
                const maxLabels = Math.min(this.data.length, Math.floor(chartW / 70));
                const labelInterval = Math.max(1, Math.ceil(this.data.length / maxLabels));
                ctx.fillStyle = textColor;
                ctx.font = '500 11px "Inter", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                for (let i = 0; i < this.data.length; i += labelInterval) {
                    ctx.fillText(this.data[i].label, this.points[i].x, padTop + chartH + 12);
                }
                if (this.data.length > 1 && (this.data.length - 1) % labelInterval !== 0) {
                    const last = this.points[this.points.length - 1];
                    ctx.fillText(this.data[this.data.length - 1].label, last.x, padTop + chartH + 12);
                }

                ctx.restore();
            },

            niceNum(val) {
                if (val <= 0) return 100;
                const mag = Math.pow(10, Math.floor(Math.log10(val)));
                const lead = val / mag;
                let nice;
                if (lead <= 1) nice = 1;
                else if (lead <= 2) nice = 2;
                else if (lead <= 5) nice = 5;
                else nice = 10;
                return nice * mag * 1.1;
            },

            easeOutExpo(x) {
                return x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
            },

            onHover(e) {
                if (this.points.length === 0) return;
                const canvas = this.$refs.canvas;
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;

                let closest = null;
                let minDist = Infinity;
                for (const p of this.points) {
                    const dist = Math.abs(p.x - mx);
                    if (dist < minDist) {
                        minDist = dist;
                        closest = p;
                    }
                }

                if (closest && minDist < 50) {
                    const tipW = 140;
                    let tx = closest.x;
                    if (tx < tipW / 2) tx = tipW / 2;
                    if (tx > rect.width - tipW / 2) tx = rect.width - tipW / 2;

                    this.tooltip = {
                        visible: true,
                        x: tx,
                        y: closest.y,
                        label: closest.data.label,
                        value: this.formatCurrency(closest.data.total),
                    };

                    this.draw(); 
                } else {
                    this.tooltip.visible = false;
                    this.draw(); 
                }
            }
        }
    }
</script>
